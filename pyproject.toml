[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plume-engine"
version = "0.1.0"
description = "Headless thermal-discharge digital twin core"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "gsw>=3.6,<4",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]
studio = ["matplotlib>=3.8,<4", "streamlit>=1.39,<2",
          "folium>=0.18,<1", "streamlit-folium>=0.23,<1"]
ocean = ["copernicusmarine>=2.0,<3", "xarray>=2024.6,<2028"]

[project.scripts]
plume = "plume.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
