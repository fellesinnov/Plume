name: Manual repository check

on:
  workflow_dispatch:
  push:
    branches:
      - model-1-single-port-kernel
    paths:
      - .github/workflows/ci.yml

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PRODUCT_SPEC.md
          test -f docs/CONFIG.md
          test -f configs/example.yaml
          test -d References
          test ! -e outfall_screen.py
          test ! -e requirements.txt
          echo "Repository structure check passed."

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Run repository tests
        run: python -m pytest -q
