name: Manual repository check

on:
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SPEC-0 repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PRODUCT_SPEC.md
          test -f docs/CONFIG.md
          test -f configs/example.yaml
          test -d References
          test ! -e outfall_screen.py
          test ! -e requirements.txt
          echo "Manual repository structure check passed."
